# Runs on every push: the same checks as `drone-race check`, on Linux with the official pins.
# Passing here means the submission imports and flies in the official environment;
# it says nothing about timing (GitHub runners are not the scoring machine).
name: check
on: [push, pull_request, workflow_dispatch]

jobs:
  submission:
    # The pinned Python 3.12.12 runtime is available on Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - name: Validate contact scoring and the flight-log contract
        run: pytest -q tests/test_scoring.py tests/test_rules.py tests/test_episode.py::test_flight_log_uses_reference_eight_field_contract tests/test_worker.py::test_evaluate_writes_logs_and_leaderboard
      - name: Check the submission folder
        run: drone-race check submission
      - name: One lap of the practice circuit
        run: drone-race run --laps 1 --headless
