# Runs on every push: the same checks as `drone-race check`, on Linux with the official pins.
# Passing here means the submission imports and flies in the official environment;
# it says nothing about timing (GitHub runners are not the scoring machine).
name: check
on: [push, pull_request, workflow_dispatch]

jobs:
  submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - name: Check the submission folder
        run: drone-race check submission
      - name: One lap of the practice circuit
        run: drone-race run --laps 1 --headless
