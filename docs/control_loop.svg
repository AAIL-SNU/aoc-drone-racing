<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Control loop between submission/ and drone_race</title>
  <desc id="desc">The controller in submission/controller.py returns an Action (thrust_N, body_rates_rad_s), applied after a one-step delay. The drone_race simulator returns an Observation. Wind acts on the simulator.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .b { font-weight: 600; }
    .h1 { font-size: 18px; font-weight: 600; }
    .h2 { font-size: 15px; font-weight: 600; }

    .bg { fill: #ffffff; stroke: #d0d7de; }
    .ink { fill: #1f2328; }
    .wire { stroke: #1f2328; stroke-width: 1.6; fill: none; }
    .head { fill: #1f2328; }
    .leader { stroke: #8c959f; stroke-width: 1; stroke-dasharray: 2 3; fill: none; }
    .wind { stroke: #1f2328; stroke-width: 1.6; stroke-dasharray: 6 4; fill: none; }
    .ctl { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .ctl-t { fill: #0550ae; }
    .sim { fill: #fff1e5; stroke: #bc4c00; stroke-width: 1.5; }
    .sim-t { fill: #953800; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .delay { fill: #ffffff; stroke: #1f2328; stroke-width: 1.4; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .ink { fill: #e6edf3; }
      .wire { stroke: #e6edf3; }
      .head { fill: #e6edf3; }
      .leader { stroke: #6e7681; }
      .wind { stroke: #e6edf3; }
      .ctl { fill: #0c2d6b; stroke: #4493f8; }
      .ctl-t { fill: #79c0ff; }
      .sim { fill: #3d1d00; stroke: #db6d28; }
      .sim-t { fill: #ffa657; }
      .card { fill: #161b22; stroke: #30363d; }
      .delay { fill: #0d1117; stroke: #e6edf3; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="499" rx="12"/>

  <!-- Action -->
  <rect class="card" x="330" y="24" width="350" height="96" rx="8"/>
  <text class="ink h2" x="350" y="52">Action</text>
  <text class="ink mono" x="350" y="80">thrust_N</text>
  <text class="ink" x="490" y="80">collective thrust [N]</text>
  <text class="ink mono" x="350" y="104">body_rates_rad_s</text>
  <text class="ink" x="490" y="104">(p, q, r) [rad/s]</text>
  <path class="leader" d="M420,120 V181"/>

  <!-- Wind -->
  <path class="wind" d="M798,40 V154" marker-end="url(#head)"/>
  <text class="ink b" x="812" y="64">Wind</text>

  <!-- Controller -->
  <rect class="ctl" x="32" y="160" width="260" height="100" rx="10"/>
  <text class="ctl-t h1" x="52" y="198">Controller</text>
  <text class="ink mono" x="52" y="226">submission/controller.py</text>

  <!-- Simulator -->
  <rect class="sim" x="668" y="160" width="260" height="100" rx="10"/>
  <text class="sim-t h1" x="688" y="198">Simulator</text>
  <text class="ink mono" x="688" y="226">drone_race</text>

  <!-- Action wire with one-step delay -->
  <path class="wire" d="M292,185 H515"/>
  <rect class="delay" x="515" y="168" width="60" height="34" rx="6"/>
  <text class="ink" x="545" y="191" text-anchor="middle" style="font-size:16px">z<tspan dy="-6" style="font-size:11px">−1</tspan></text>
  <path class="wire" d="M575,185 H666" marker-end="url(#head)"/>

  <!-- Observation wire -->
  <path class="wire" d="M668,235 H294" marker-end="url(#head)"/>
  <path class="leader" d="M480,239 V300"/>

  <!-- Observation -->
  <rect class="card" x="32" y="300" width="896" height="176" rx="8"/>
  <text class="ink h2" x="52" y="328">Observation</text>

  <text class="ink b" x="52" y="356">Vehicle state</text>
  <text class="ink mono" x="52" y="380">time_s</text>
  <text class="ink" x="192" y="380">simulation time [s]</text>
  <text class="ink mono" x="52" y="400">position_m</text>
  <text class="ink" x="192" y="400">(x, y, z) [m]</text>
  <text class="ink mono" x="52" y="420">velocity_m_s</text>
  <text class="ink" x="192" y="420">(vx, vy, vz) [m/s]</text>
  <text class="ink mono" x="52" y="440">quaternion_xyzw</text>
  <text class="ink" x="192" y="440">attitude, body → world</text>
  <text class="ink mono" x="52" y="460">body_rates_rad_s</text>
  <text class="ink" x="192" y="460">(p, q, r) [rad/s]</text>

  <text class="ink b" x="372" y="356">Race progress</text>
  <text class="ink mono" x="372" y="380">next_gate</text>
  <text class="ink" x="500" y="380">next gate index</text>
  <text class="ink mono" x="372" y="400">lap</text>
  <text class="ink" x="500" y="400">current lap, 0-based</text>
  <text class="ink mono" x="372" y="420">gates_passed</text>
  <text class="ink" x="500" y="420">gates passed so far</text>
  <text class="ink mono" x="372" y="440">gate_collisions</text>
  <text class="ink" x="500" y="440">frame contacts so far</text>

  <text class="ink b" x="668" y="356">Battery</text>
  <text class="ink mono" x="668" y="380">battery_soc</text>
  <text class="ink" x="812" y="380">charge, 1 → 0</text>
  <text class="ink mono" x="668" y="400">battery_voltage_V</text>
  <text class="ink" x="812" y="400">voltage [V]</text>
  <text class="ink mono" x="668" y="420">thrust_limit_N</text>
  <text class="ink" x="812" y="420">max thrust [N]</text>
</svg>
