[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quad-race"
version = "0.1.0"
description = "A small, reproducible controller-submission racing prototype powered by RotorPy"
requires-python = ">=3.12,<3.13"
dependencies = ["rotorpy==3.0.0", "numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quad-race = "quad_race.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quad_race"]

[tool.pytest.ini_options]
testpaths = ["tests"]
